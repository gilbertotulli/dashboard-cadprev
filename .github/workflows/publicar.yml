# Publica o painel no GitHub Pages.
#
# Os runners do GitHub alcançam a API do CADPREV, então a publicação ingere
# dados reais. Se os nomes dos campos ainda não estiverem resolvidos, a ingestão
# falha alto e a versão anterior do site continua no ar — melhor do que publicar
# uma tela de números vazios.
#
# O Pages é habilitado pelo próprio workflow na primeira execução.
name: publicar painel

on:
  schedule:
    - cron: "17 6 * * 1"      # segundas, 06:17 UTC (03:17 em Brasília)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      uf:
        description: "UF (vazio = todos os RPPS do país)"
        required: false
        default: ""
      ano:
        description: "Exercício (vazio = ano corrente)"
        required: false
        default: ""
      mes:
        description: "Mês da competência do DAIR (vazio = três meses atrás)"
        required: false
        default: ""
      usar_demonstracao:
        description: "Publicar o conjunto sintético em vez de dados reais"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Não cancelar: a carga nacional leva perto de quarenta minutos, e matá-la
  # para rodar outra idêntica é desperdício — de tempo e de requisições a um
  # serviço público que pede uma por segundo.
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # A carga nacional é longa e fica mais longa ainda quando a API pede calma.
    # O teto evita que uma execução travada ocupe a fila indefinidamente.
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O banco sobrevive entre execuções. Um push de código não precisa varrer a
      # API de novo: republica com os dados que já estão lá, e o dado se renova
      # no agendamento semanal ou quando alguém dispara a mão.
      #
      # Restaurar e gravar são passos separados de propósito. O actions/cache
      # inteiro só grava quando o job termina bem, e foi assim que uma carga de
      # setenta minutos foi para o lixo porque a publicação tropeçou depois. O
      # dado custou caro e não depende do Pages: grava assim que a varredura
      # fecha.
      - uses: actions/cache/restore@v4
        with:
          path: cadprev.sqlite3
          key: cadprev-banco-${{ github.run_id }}
          restore-keys: cadprev-banco-

      # A competência é perguntada à fonte, não deduzida do calendário. A conta
      # anterior — ano corrente, mês de três meses atrás — pedia, de janeiro a
      # março, uma competência do ano que ainda não tinha chegado, e teria
      # deixado o painel sem atualizar esses três meses todo ano.
      - name: Definir a competência
        id: comp
        if: ${{ !inputs.usar_demonstracao }}
        env:
          UF: ${{ inputs.uf }}
        run: |
          ANO="${{ inputs.ano }}"
          MES="${{ inputs.mes }}"
          # Republicar do cache não muda competência nenhuma. Descobri-la
          # custaria catorze requisições a um serviço público que pede uma por
          # segundo, para jogar o resultado fora.
          if [ "${{ github.event_name }}" = "push" ] && [ -s cadprev.sqlite3 ]; then
            echo "republicando do cache: competência inalterada"
            echo "ano=$ANO" >> "$GITHUB_OUTPUT"
            echo "mes=$MES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ORIGEM="informada"
          if [ -z "$ANO" ] || [ -z "$MES" ]; then
            FILTRO_UF=""
            [ -n "$UF" ] && FILTRO_UF="--uf $UF"
            # O comando já cai para a competência do banco quando a fonte não
            # responde, e diz na saída de qual das duas veio. Só falha de
            # verdade quando não há nem uma nem outra — aí não há o que
            # publicar, e falhar é a resposta certa.
            if ! python -m cadprev competencia $FILTRO_UF > competencia.txt; then
              echo "::error::sem competência do DAIR: a API não respondeu e o banco está vazio"
              cat competencia.txt || true
              exit 1
            fi
            cat competencia.txt
            [ -z "$ANO" ] && ANO=$(grep '^ano=' competencia.txt | cut -d= -f2)
            [ -z "$MES" ] && MES=$(grep '^mes=' competencia.txt | cut -d= -f2)
            ORIGEM=$(grep '^origem=' competencia.txt | cut -d= -f2)
          fi
          echo "ano=$ANO" >> "$GITHUB_OUTPUT"
          echo "mes=$MES" >> "$GITHUB_OUTPUT"
          echo "origem=$ORIGEM" >> "$GITHUB_OUTPUT"
          echo "Competência: $MES/$ANO (origem: $ORIGEM)"
          if [ "$ORIGEM" = "banco" ]; then
            echo "::warning::a API do CADPREV não respondeu; publicando com os dados que já estavam no banco"
          fi

      - name: Conjunto de demonstração
        if: inputs.usar_demonstracao
        run: python -m cadprev demo

      - name: Ingerir dados reais
        id: ingestao
        if: ${{ !inputs.usar_demonstracao }}
        env:
          UF: ${{ inputs.uf }}
          ANO: ${{ steps.comp.outputs.ano }}
          MES: ${{ steps.comp.outputs.mes }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -s cadprev.sqlite3 ]; then
            echo "Push de código com banco em cache: republicando sem reingerir."
            echo "varreu=nao" >> "$GITHUB_OUTPUT"
            python -m cadprev status
            exit 0
          fi

          FILTRO_UF=""
          [ -n "$UF" ] && FILTRO_UF="--uf $UF"

          # Quantas ingestões o banco registrava antes desta carga. Se o número
          # não mudar, nada foi varrido — e dizer que varreu autorizaria gravar
          # no cache um banco idêntico ao que veio dele, além de carimbar como
          # varredura uma execução em que a fonte não respondeu.
          python -m cadprev execucoes > execucoes-antes.txt || echo 0 > execucoes-antes.txt
          EXECUCOES_ANTES=$(cat execucoes-antes.txt)

          # Mede antes de varrer. O carimbo de atualização da fonte é uma
          # requisição, e é o histórico dele que vai dizer, daqui a algumas
          # semanas, se a varredura completa semanal se justifica. Por ora só
          # anota — nada é cortado com base nele.
          python -m cadprev marco 2>&1 | tee -a ingest.log || true

          # Melhor esforço: a falha de um endpoint secundário deixa um cartão
          # vazio, não justifica derrubar a publicação inteira. Os essenciais
          # são conferidos logo abaixo.
          #
          # Os essenciais primeiro, enquanto a API ainda está sem reclamar. Na
          # carga nacional ela começa a pedir calma depois de algumas centenas
          # de milhares de linhas, e deixar a carteira por último foi o que fez
          # a primeira tentativa terminar sem o dado que sustenta o painel.
          #
          # Três competências da carteira, não o ano inteiro: o ano seriam mais
          # de um milhão de linhas, e três meses é o que a tela detalhada usa
          # para mostrar como a carteira se moveu. Os agregados nacionais usam
          # só a mais recente — quem soma competências conta o mesmo dinheiro
          # duas vezes.
          # A tabela de entes da federação do Tesouro: uma requisição para o
          # país inteiro. Dá população e marca de capital autoritativas, no
          # lugar da dedução por nome que promovia município a governo estadual.
          python -m cadprev siconfi 2>&1 | tee -a ingest.log || true

          # A mais recente primeiro: se a API cansar no meio, o painel fica com
          # a competência que importa e sem as anteriores, em vez do contrário.
          for VOLTA in 0 1 2; do
            M=$(( MES - VOLTA )); A="$ANO"
            if [ "$M" -le 0 ]; then M=$(( M + 12 )); A=$(( ANO - 1 )); fi
            python -m cadprev ingest DAIR_CARTEIRA \
              $FILTRO_UF --ano "$A" --mes "$M" 2>&1 | tee -a ingest.log || true
          done

          # O cabeçalho do DAIR é mensal e pequeno — treze mil linhas no ano
          # inteiro. Vem sem --mes de propósito: é da série completa que sai a
          # data do último demonstrativo de cada ente, e portanto a defasagem.
          python -m cadprev ingest DAIR_IDENTIFICACAO \
            $FILTRO_UF --ano "$ANO" 2>&1 | tee -a ingest.log || true

          python -m cadprev ingest RPPS_CRP RPPS_REGIME_PREVIDENCIARIO \
            RPPS_ALIQUOTA $FILTRO_UF 2>&1 | tee -a ingest.log || true

          # Governança: quem responde pelos recursos e a validade da
          # certificação de cada um. Uma linha por pessoa E por certificação —
          # a leitura de regularidade é por pessoa, porque vencida ao lado de
          # vigente não é irregularidade.
          python -m cadprev ingest DAIR_GOVERNANCA \
            $FILTRO_UF --ano "$ANO" 2>&1 | tee -a ingest.log || true

          # O DIPR vem com o ano inteiro, para que a aba de caixa tenha a série
          # mensal completa. É a maior carga, e vai por último de propósito.
          # O DRAA_NOTIFICACAO não aceita exercício: são as notificações da
          # SPREV desde 2016, e o conjunto inteiro cabe numa página.
          python -m cadprev ingest DRAA_NOTIFICACAO \
            $FILTRO_UF 2>&1 | tee -a ingest.log || true

          python -m cadprev ingest \
            DRAA_ESTATISTICA DRAA_SEGREGACAO_MASSA DRAA_FLUXO_ATUARIAL \
            DRAA_VALORES_COMPROMISSOS DRAA_HIPOTESE_ATUARIAL \
            DRAA_PLANO_CUSTEIO DRAA_ENCAMINHAMENTO \
            DRAA_COMPARATIVO_RECEITA DRAA_PLANO_AMORTIZACAO DIPR \
            $FILTRO_UF --ano "$ANO" --exercicio "$ANO" 2>&1 | tee -a ingest.log || true

          # O Anexo 04 do SICONFI: a decomposição por fundo que o CADPREV não
          # expõe. É uma requisição por ente — cerca de meia hora para o país —
          # e por isso vem depois de tudo, quando o essencial já está no banco.
          # O bimestre é o que contém o mês da competência do DAIR.
          BIMESTRE=$(( (MES + 1) / 2 ))
          python -m cadprev siconfi-rreo \
            --exercicio "$ANO" --periodo "$BIMESTRE" $FILTRO_UF \
            2>&1 | tee -a ingest.log || true

          python -m cadprev status

          # Sem estes dois não há painel: o CRP sustenta o panorama e a ficha,
          # a carteira sustenta a aba de investimentos.
          python - <<'PY'
          import sys
          from cadprev.store import Store
          with Store() as store:
              faltando = [nome for nome in ("RPPS_CRP", "DAIR_CARTEIRA")
                          if store.contar(nome) == 0]
          if faltando:
              print("\nSem dados nos endpoints essenciais: " + ", ".join(faltando),
                    file=sys.stderr)
              print("Se a causa for campo obrigatório não resolvido, rode o workflow"
                    " 'descobrir campos da API'.", file=sys.stderr)
              sys.exit(1)
          PY

          # Depois da guarda, e só depois: os essenciais estão lá. Mas "estão
          # no banco" não quer dizer "vieram desta carga" — com o cache
          # restaurado a guarda passa mesmo que a API não tenha respondido a
          # nada. A gravação no cache exige as duas coisas.
          python -m cadprev execucoes > execucoes-depois.txt || echo 0 > execucoes-depois.txt
          EXECUCOES_DEPOIS=$(cat execucoes-depois.txt)
          if [ "$EXECUCOES_DEPOIS" -gt "$EXECUCOES_ANTES" ]; then
            echo "varreu=sim" >> "$GITHUB_OUTPUT"
          else
            echo "varreu=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::nenhum endpoint respondeu nesta carga; publicando o banco anterior sem regravar o cache"
          fi

      # Só o que a varredura confirmou entra no cache. Uma ingestão que falhou
      # deixa o banco consistente — a gravação é transacional —, mas pode estar
      # sem um endpoint essencial, e um push futuro republicaria esse buraco
      # sem nem perceber. Republicar sem varrer também não grava: seria reenviar
      # ao cache exatamente o banco que veio dele.
      - name: Guardar o banco
        if: always() && steps.ingestao.outputs.varreu == 'sim'
        uses: actions/cache/save@v4
        with:
          path: cadprev.sqlite3
          key: cadprev-banco-${{ github.run_id }}

      - name: Construir o painel
        id: construcao
        run: |
          if [ "${{ inputs.usar_demonstracao }}" = "true" ]; then
            echo "painel já construído com o conjunto de demonstração"
          else
            python -m cadprev build --origem api
          fi
          test -s web/data/meta.json
          test -s web/data/entes.json

      - name: Resumo
        if: always()
        run: |
          {
            echo "# Publicação do painel"
            echo
            if [ "${{ inputs.usar_demonstracao }}" = "true" ]; then
              echo "Publicado com o **conjunto de demonstração** (dados sintéticos)."
            else
              COMP="${{ steps.comp.outputs.mes }}/${{ steps.comp.outputs.ano }}"
              [ "$COMP" = "/" ] && COMP="a mesma do banco em cache"
              echo "Competência do DAIR: **$COMP**"
              echo "UF: **${{ inputs.uf || 'todas' }}**"
            fi
            echo
            if [ -f web/data/meta.json ]; then
              echo '```json'
              python -c "import json;m=json.load(open('web/data/meta.json'));print(json.dumps({k:m[k] for k in ('origem','gerado_em','entes','nivel_fundo')},ensure_ascii=False,indent=2))"
              echo '```'
            else
              echo "> A construção não produziu dados."
              echo
              echo "Se a ingestão falhou por campo obrigatório não resolvido, rode o"
              echo "workflow **descobrir campos da API** e ajuste \`cadprev/fieldmap.py\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # enablement liga o Pages na primeira execução, em vez de exigir que
      # alguém vá às configurações do repositório. O site fica público — que é
      # o ponto de publicar dados públicos — e pode ser desligado em
      # Settings → Pages a qualquer momento.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4

      # O GITHUB_TOKEN consegue publicar no Pages, mas não consegue criá-lo: a
      # API de criação responde "Resource not accessible by integration" por
      # mais permissão que o workflow declare. O enablement acima resolve quando
      # o site já existe; da primeira vez alguém precisa ligar o Pages à mão.
      # Sem esta explicação, o erro no log não diz o que fazer.
      - name: Explicar a falha da publicação
        if: failure() && steps.construcao.outcome == 'success'
        run: |
          {
            echo
            echo "## A publicação não saiu"
            echo
            echo "Se o log acima traz **Create Pages site failed — Resource not"
            echo "accessible by integration**, o Pages ainda não está ligado neste"
            echo "repositório, e o token do workflow não tem alçada para ligá-lo."
            echo
            echo "Ligue uma vez em **Settings → Pages → Build and deployment →"
            echo "Source: GitHub Actions**. Depois é só reexecutar esta execução:"
            echo "o banco fica em cache, então ela republica em cerca de um minuto,"
            echo "sem varrer a API outra vez."
          } >> "$GITHUB_STEP_SUMMARY"
