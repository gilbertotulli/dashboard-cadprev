name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Sem passo de instalação: o pacote usa só a biblioteca padrão.
      - name: Testes
        run: python -m unittest discover -s tests -v

      - name: O painel continua de pé
        run: |
          python -m cadprev demo
          test -s web/data/meta.json
          test -s web/data/carteira-nacional.json
          test -s web/data/panorama.json
          test -s web/data/filtros.json
          test -s web/data/qualidade.json

      # O comparativo calcula a mediana de uma seleção arbitrária no navegador,
      # porque não há como pré-computar a mediana de um conjunto que o leitor
      # monta na hora. É a única conta que existe nos dois lados, e duas
      # implementações da mesma conta divergem sozinhas com o tempo: este passo
      # exige que a seleção reproduza o grupo equivalente até o centésimo.
      - name: A estatística do navegador bate com a do Python
        run: node tests/estatistica-do-navegador.mjs

      # openpyxl só entra aqui, não no pacote: é um leitor independente para
      # validar o .xlsx que web/planilha.js escreve à mão, não uma dependência
      # do painel.
      - name: A planilha exportada abre de verdade
        run: |
          pip install openpyxl
          node tests/planilha.node.mjs
